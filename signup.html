<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f8fc">
    <title>สมัครสมาชิก | omm-dev</title>
    <link rel="icon" href="omm-tech-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="page-title">
            <div class="brand" aria-label="omm-dev">
                <img class="brand-symbol" src="omm-tech-logo.svg" alt="">
                <span>omm<span class="brand-accent">-dev</span></span>
            </div>

            <div class="auth-heading">
                <span class="eyebrow">เริ่มต้นใช้งานได้เลย</span>
                <h1 id="page-title">สร้างบัญชีใหม่</h1>
                <p>สมัครสมาชิกเพื่อเริ่มต้นประสบการณ์ของคุณ</p>
            </div>

            <form class="auth-form" method="post">
                <div class="field">
                    <label for="username">ชื่อผู้ใช้</label>
                    <input type="text" id="username" name="username" placeholder="ตั้งชื่อผู้ใช้ของคุณ" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">รหัสผ่าน</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" placeholder="สร้างรหัสผ่าน" autocomplete="new-password" required>
                        <button class="password-toggle" type="button" aria-label="แสดงรหัสผ่าน" aria-pressed="false" data-password-toggle="password">แสดง</button>
                    </div>
                </div>
                <button class="submit-button" type="submit">สมัครสมาชิก <span aria-hidden="true">→</span></button>
            </form>
        </section>
        <p class="page-note">บัญชีเดียว พร้อมเริ่มต้นสิ่งใหม่</p>
    </main>
</body>
</html>
